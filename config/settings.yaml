system:
  project_name: "AutoApply"
  environment: "production"
  db_path: "data/applications.db"

resume_attachment:
  master_pdf_path: "data/ResumeSoftwareEngineer.pdf"

llm_routing:
  provider: "gemini"
  model: "gemini-2.5-flash"
  fast_model: "gemini-2.5-flash"
  temperature: 0.1

matching_thresholds:
  min_fit_score: 80


job_search:
  # Target Roles (searched simultaneously via Boolean query)
  target_titles:
    - "Staff Software Engineer"
    - "Senior Software Engineer"
    - "AI ML Software Engineer"
    - "AI Software Engineer"
    - "Machine Learning Software Engineer"
  
  # Search Location on LinkedIn (e.g. "United States" for all states including CA, or "California")
  target_location: "United States"
  easy_apply_only: true
  
  # === RECENCY CONTROLS ===
  sort_by_recent_first: true                # Uses sortBy=DD (Date Descending - newest minutes/hours ago first)
  time_posted_range: "r86400"               # r86400 = Past 24 Hours, r259200 = Past 3 Days, r604800 = Past Week

company_filters:
  min_employees: 5000                       # Rejects companies with < 5000 employees (Strict >= 5,000 threshold)
  public_company_only: false                # Allow enterprise private companies if >= 5000 employees
  excluded_industries:
    - "Business Consulting and Services"
    - "Information Technology & Services"
    - "Staffing and Recruiting"
    - "IT Services and IT Consulting"
    - "Staffing"
    - "Recruiting"
    - "Consulting"
    - "Human Resources Services"

automation_safety:
  headless_browser: true                    # Headless execution: zero GUI disturbance
  user_data_dir: "data/browser_profile"
  auto_submit: true                         # 100% autonomous submission (zero manual pauses)
  step_inspection_delay_seconds: 0.4        # Accelerated modal step execution
  delay_between_jobs_seconds: 1.0           # Fast inter-job transition delay
  max_applications_per_run: 30

pacing:
  enabled: true
  active_start_hour: 9
  active_end_hour: 21
  active_end_minute: 30
  min_daily_target: 42
  max_daily_target: 47
  weekend_min_target: 12
  weekend_max_target: 20
  hard_24h_cap: 48

notifications:
  enabled: true                             # Send desktop alert when daily application cap is hit
  sound: "Glass"                            # macOS sound name (Glass, Ping, Hero, Bottle, etc.)
  alert_on_daily_cap: true                  # Ping user when daily stochastic quota or hard cap is reached