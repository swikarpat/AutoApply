system:
  project_name: "agentic-job-ai"
  environment: "production"
  log_level: "INFO"
  db_path: "data/applications.db"

resume_attachment:
  master_pdf_path: "data/ResumeSoftwareEngineer.pdf"

llm_routing:
  provider: "gemini"
  model: "gemini-2.5-flash"
  temperature: 0.1
  request_timeout_seconds: 15.0

matching_thresholds:
  min_fit_score: 75
  hard_filter_location: "San Francisco, CA"
  allow_remote: true

job_search:
  source: "linkedin"
  easy_apply_only: true
  target_titles:
    - "Staff AI ML Software Engineer"
    - "Staff Software Engineer"
    - "Software Engineer Distributed Systems"
  locations:
    - "San Francisco Bay Area"
    - "Remote"

automation_safety:
  headless_browser: false
  user_data_dir: "data/browser_profile"
  auto_submit: true
  max_applications_per_run: 50
  delay_between_jobs_seconds: 2       # Fast transition between job applications