system:
  project_name: "AutoApply"
  environment: "production"
  db_path: "data/applications.db"

resume_attachment:
  master_pdf_path: "data/ResumeSoftwareEngineer.pdf"

llm_routing:
  provider: "gemini"
  model: "gemini-2.5-flash"
  fast_model: "gemini-2.5-flash"
  temperature: 0.1

matching_thresholds:
  min_fit_score: 80


job_search:
  # Target Roles (searched simultaneously via Boolean query)
  target_titles:
    - "Staff Software Engineer"
    - "Senior Software Engineer"
    - "AI ML Software Engineer"
    - "AI Software Engineer"
    - "Machine Learning Software Engineer"
  
  target_location: "United States"
  exclude_california: true                  # Filters out CA & Bay Area postings
  easy_apply_only: true
  
  # === RECENCY CONTROLS ===
  sort_by_recent_first: true                # Uses sortBy=DD (Date Descending - newest minutes/hours ago first)
  time_posted_range: "r86400"               # r86400 = Past 24 Hours, r259200 = Past 3 Days, r604800 = Past Week

company_filters:
  min_employees: 201                        # Rejects companies with <= 200 employees
  public_company_only: true                 # Rejects "Privately Held", accepts "Public Company"
  excluded_industries:
    - "Business Consulting and Services"
    - "Information Technology & Services"
    - "Staffing and Recruiting"
    - "IT Services and IT Consulting"
    - "Staffing"
    - "Recruiting"
    - "Consulting"
    - "Human Resources Services"

automation_safety:
  headless_browser: false
  user_data_dir: "data/browser_profile"
  auto_submit: true
  step_inspection_delay_seconds: 3.0
  delay_between_jobs_seconds: 4.0
  max_applications_per_run: 30